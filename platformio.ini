[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
build_type = release
upload_port = COM3
upload_speed = 921600
monitor_port = COM3
monitor_speed = 115200

[env:bench-dac]
extends = env:esp32dev
build_flags =
	-DASTEROIDS_RENDERER_BENCHMARK=1
	-DASTEROIDS_RENDERER_MODE=1

[env:calibration]
extends = env:esp32dev
build_flags = -DASTEROIDS_CALIBRATION_DIAGNOSTICS=1

[env:bench-spi]
extends = env:esp32dev
build_flags =
	-DASTEROIDS_RENDERER_BENCHMARK=1
	-DASTEROIDS_RENDERER_MODE=2

[env:test-arcade]
extends = env:esp32dev
build_flags = -DARCADE_TESTS=1
test_build_src = yes
build_src_filter = +<*> -<main.cpp>
test_filter = test_arcade

[env:spi-buffered]
extends = env:esp32dev
build_flags = -DASTEROIDS_RENDERER_MODE=4

[env:spi-bench-driver]
extends = env:esp32dev
build_flags =
	-DASTEROIDS_RENDERER_MODE=4
	-DASTEROIDS_SPI_BENCHMARK=1
	-DASTEROIDS_SPI_LOW_LEVEL=0

[env:spi-bench-registers]
extends = env:esp32dev
build_flags =
	-DASTEROIDS_RENDERER_MODE=4
	-DASTEROIDS_SPI_BENCHMARK=1
	-DASTEROIDS_SPI_LOW_LEVEL=1

[env:spi-bench-live-driver]
extends = env:esp32dev
build_flags =
	-DASTEROIDS_RENDERER_MODE=4
	-DASTEROIDS_SPI_BENCHMARK=2
	-DASTEROIDS_SPI_LOW_LEVEL=0

[env:spi-bench-live-registers]
extends = env:esp32dev
build_flags =
	-DASTEROIDS_RENDERER_MODE=4
	-DASTEROIDS_SPI_BENCHMARK=2
	-DASTEROIDS_SPI_LOW_LEVEL=1
